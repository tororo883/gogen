<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AnkiEtym - TOEIC900 語源フラッシュカード</title>

  <!-- フルスクリーンPWA設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AnkiEtym">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e1e1e">

  <!-- アプリアイコン -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e293b'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='%2338bdf8'>🧩</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e293b'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='%2338bdf8'>🧩</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

  <!-- スマホサイズコンテナ -->
  <div class="w-full max-w-md h-[100dvh] sm:h-[850px] bg-[#1e1e1e] sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-neutral-800 relative">

    <!-- 1. トップアプリバー -->
    <header class="bg-[#282828] px-3.5 py-3 flex items-center justify-between border-b border-neutral-700 shrink-0">
      <div class="flex items-center gap-2">
        <span class="text-lg">🧩</span>
        <div>
          <span class="font-bold text-sm sm:text-base tracking-wide text-neutral-100 block leading-none">AnkiEtym</span>
          <span id="total-deck-count" class="text-[10px] text-neutral-400 font-mono">全24語</span>
        </div>
      </div>
      
      <!-- 残りカードカウント (青:新規 / 赤:当日再学習 / 緑:復習期日到来) -->
      <div class="flex items-center gap-2 text-xs font-mono font-bold">
        <div class="flex gap-2.5 bg-[#161616] px-3 py-1.5 rounded-lg border border-neutral-700 text-sm" title="青:未学習 / 赤:当日学習中 / 緑:本日復習">
          <span id="count-new" class="text-sky-400 underline">0</span>
          <span id="count-learn" class="text-rose-400">0</span>
          <span id="count-review" class="text-emerald-400">0</span>
        </div>
        <button onclick="openModal('import-modal')" class="text-xs text-sky-300 hover:text-white px-2.5 py-1.5 rounded-lg bg-sky-950 border border-sky-700 active:scale-95 transition">
          ➕ 追加
        </button>
        <button onclick="openModal('menu-modal')" class="text-xs text-neutral-300 hover:text-white px-2 py-1.5 rounded-lg bg-neutral-700 active:scale-95 transition">
          ⚙️
        </button>
      </div>
    </header>

    <!-- 2. メインカード領域 -->
    <main id="card-content" class="flex-1 overflow-y-auto px-5 py-5 space-y-5">
      
      <!-- すべて完了した時の画面 -->
      <section id="completed-screen" class="hidden text-center py-12 space-y-5 fade-in">
        <div class="text-5xl">🎉</div>
        <h2 class="text-2xl font-extrabold text-white">本日の出題カードをすべて消化しました！</h2>
        <p class="text-sm text-neutral-400 leading-relaxed">
          現在、期日が到来している復習カードと未学習カードはすべてクリアされています。<br>
          さらに先取りして復習するか、新しい単語セットを追加しましょう。
        </p>
        <div class="flex flex-col gap-3 pt-4">
          <button onclick="cramStudyMode()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg active:scale-95 transition">
            🔥 先取り特訓モード（期日前の復習カードを前倒し出題）
          </button>
          <button onclick="openModal('import-modal')" class="w-full py-3.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl shadow-lg active:scale-95 transition">
            ➕ 新しい単語・語源データを追加する
          </button>
        </div>
      </section>

      <!-- 【表面：常に表示】単語と英語例文 -->
      <section id="question-section" class="text-center space-y-3">
        <div class="flex items-center justify-center gap-2 flex-wrap">
          <span id="word-pos" class="text-xs font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded bg-neutral-700 text-neutral-200">
            動詞
          </span>
          <span id="card-status-badge" class="text-xs px-2.5 py-0.5 rounded font-medium bg-sky-950 text-sky-300 border border-sky-800">
            新規カード
          </span>
          <span id="leech-badge" class="hidden text-xs px-2 py-0.5 rounded font-bold bg-amber-950 text-amber-300 border border-amber-700">
            ⚡ 要注意語 (ミス3回以上)
          </span>
        </div>

        <!-- 英単語 & 発音ボタン -->
        <div class="flex items-center justify-center gap-3 pt-1">
          <h1 id="word-text" class="text-4xl font-extrabold tracking-tight text-white">
            inspect
          </h1>
          <button onclick="speakWord()" title="発音を聞く" class="p-2.5 rounded-full bg-neutral-800 hover:bg-neutral-700 text-sky-400 active:scale-90 transition border border-neutral-700">
            🔊
          </button>
        </div>

        <p id="word-phonetic" class="text-sm text-neutral-400 font-mono">/ɪnˈspekt/</p>

        <!-- Leech（苦手単語）用の表面語源ヒント補助輪 -->
        <div id="surface-hint" class="hidden bg-amber-950/40 border border-amber-700/60 rounded-lg px-3 py-2 text-xs text-amber-200">
          💡 語源ヒント: <span id="surface-hint-text" class="font-mono font-bold"></span>
        </div>

        <!-- 英語例文ボックス -->
        <div class="bg-[#262626] p-4 rounded-xl border border-neutral-700/80 text-left mt-3 shadow-inner">
          <p class="text-[11px] text-neutral-400 mb-1 font-semibold">TOEIC実践例文</p>
          <p id="sentence-en" class="text-base text-neutral-100 leading-relaxed"></p>
        </div>
      </section>

      <!-- 【裏面：解答表示タップ後に展開】 -->
      <section id="answer-section" class="hidden space-y-4 fade-in">
        <hr class="border-neutral-700" />

        <!-- ① 単語の意味と例文の和訳 -->
        <div class="space-y-3 text-center">
          <h2 id="word-meaning" class="text-xl sm:text-2xl font-bold text-emerald-400"></h2>
          <div class="bg-[#262626]/90 p-3.5 rounded-xl border border-neutral-700/70 text-left">
            <p class="text-[11px] text-neutral-400 mb-1">例文の訳</p>
            <p id="sentence-ja" class="text-sm text-neutral-200 leading-relaxed"></p>
          </div>
        </div>

        <!-- ② 語源（Etymology）分解パネル -->
        <div class="bg-[#19232d] border border-sky-800/70 rounded-xl p-4 space-y-3.5 shadow-md">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold uppercase tracking-wider text-sky-300">
              🧩 語源パーツ分解
            </span>
            <span id="cluster-progress" class="text-[11px] font-mono text-amber-300 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800/60">
              語根制覇: 1/4
            </span>
          </div>

          <!-- パーツの視覚的ブロック -->
          <div id="etymology-parts" class="flex flex-wrap items-center justify-center gap-2 py-1"></div>

          <!-- コアイメージ解説 -->
          <div class="bg-[#111820] p-
